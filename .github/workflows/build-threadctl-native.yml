name: build-threadctl-native

on:
  push:
    branches:
      - build-threadctl-native-20260808

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[threadctl-build-output]') && !contains(github.event.head_commit.message, '[module-scaffold]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout upstream threadctl-rs
        uses: actions/checkout@v4
        with:
          repository: StarfallSeas/threadctl-rs
          ref: 60f223d156d630082a803a165ac9ac898f43f8b9
          path: threadctl-rs

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Locate Android NDK and build unmodified upstream daemon
        shell: bash
        run: |
          set -euxo pipefail
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "$NDK_ROOT"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          test -x "$LINKER"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER"
          cd threadctl-rs
          cargo test --locked -p threadctl-core
          cargo build --locked --release --target aarch64-linux-android -p threadctl
          "$TOOLCHAIN/llvm-strip" target/aarch64-linux-android/release/threadctl || true
          file target/aarch64-linux-android/release/threadctl
          readelf -h target/aarch64-linux-android/release/threadctl
          readelf -l target/aarch64-linux-android/release/threadctl | grep -E 'Requesting program interpreter|INTERP' -A1 || true

      - name: Assemble KernelSU module
        shell: bash
        run: |
          set -euxo pipefail
          test -f threadctl-module/module.prop
          test -f threadctl-module/webroot/index.html
          mkdir -p threadctl-module/bin threadctl-release
          cp threadctl-rs/target/aarch64-linux-android/release/threadctl threadctl-module/bin/threadctl
          cp threadctl-rs/LICENSE threadctl-module/LICENSE.threadctl-rs
          chmod 0755 threadctl-module/bin/threadctl
          sha256sum threadctl-module/bin/threadctl > threadctl-module/THREADCTL.sha256
          cat > threadctl-module/UPSTREAM.txt <<'EOF'
          Upstream: https://github.com/StarfallSeas/threadctl-rs
          Upstream commit: 60f223d156d630082a803a165ac9ac898f43f8b9
          Upstream version: 2.0.0
          Cargo package: threadctl
          Target: aarch64-linux-android
          Android API linker: aarch64-linux-android26-clang
          Build command: cargo build --locked --release --target aarch64-linux-android -p threadctl
          Source modifications to threadctl-rs: none
          WebUI/module wrapper: added outside the upstream source tree
          EOF
          rm -f threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip
          (cd threadctl-module && zip -9 -r ../threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip . -x 'BUILD_TRIGGER')
          sha256sum threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip > threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256

      - name: Validate packaged module
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip
          unzip -l threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip | grep -E 'module.prop|bin/threadctl|webroot/index.html|config/advanced.kdl|LICENSE.threadctl-rs'
          unzip -p threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip bin/threadctl > /tmp/threadctl
          chmod +x /tmp/threadctl
          file /tmp/threadctl
          readelf -h /tmp/threadctl | grep -E 'Class:|Machine:'
          test "$(sha256sum /tmp/threadctl | awk '{print $1}')" = "$(awk '{print $1}' threadctl-module/THREADCTL.sha256)"

      - name: Store release output on build branch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p threadctl-build-output
          cp threadctl-module/bin/threadctl threadctl-build-output/threadctl
          cp threadctl-module/THREADCTL.sha256 threadctl-build-output/threadctl.sha256
          cp threadctl-module/UPSTREAM.txt threadctl-build-output/PROVENANCE.txt
          cp threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip threadctl-build-output/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip
          cp threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256 threadctl-build-output/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threadctl-build-output
          git commit -m "[threadctl-build-output] native KernelSU module" || exit 0
          git push origin HEAD:build-threadctl-native-20260808

name: package-threadctl-native-module

on:
  push:
    branches:
      - build-threadctl-native-20260808

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[threadctl-build-output]') && !contains(github.event.head_commit.message, '[module-scaffold]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned upstream for license/provenance
        uses: actions/checkout@v4
        with:
          repository: StarfallSeas/threadctl-rs
          ref: 60f223d156d630082a803a165ac9ac898f43f8b9
          path: upstream-threadctl-rs

      - name: Verify previously compiled original Android ARM64 daemon
        shell: bash
        run: |
          set -euxo pipefail
          BIN=threadctl-build-output/threadctl
          test -f "$BIN"
          EXPECTED=2ffe4dcf675ce7eeb4797349c6a3a63d3fd21b1b258c7ab68c558ee49dce3a89
          ACTUAL="$(sha256sum "$BIN" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          readelf -l "$BIN" | grep -E 'Requesting program interpreter|INTERP' -A1 || true

      - name: Assemble KernelSU module around original daemon
        shell: bash
        run: |
          set -euxo pipefail
          test -f threadctl-module/module.prop
          test -f threadctl-module/webroot/index.html
          mkdir -p threadctl-module/bin threadctl-release
          cp threadctl-build-output/threadctl threadctl-module/bin/threadctl
          cp upstream-threadctl-rs/LICENSE threadctl-module/LICENSE.threadctl-rs
          chmod 0755 threadctl-module/bin/threadctl
          sha256sum threadctl-module/bin/threadctl > threadctl-module/THREADCTL.sha256
          cat > threadctl-module/UPSTREAM.txt <<'EOF'
          Upstream: https://github.com/StarfallSeas/threadctl-rs
          Upstream commit: 60f223d156d630082a803a165ac9ac898f43f8b9
          Upstream version: 2.0.0
          Cargo package: threadctl
          Target: aarch64-linux-android
          Android API linker used for native build: aarch64-linux-android26-clang
          Original native ELF SHA-256: 2ffe4dcf675ce7eeb4797349c6a3a63d3fd21b1b258c7ab68c558ee49dce3a89
          Source modifications to threadctl-rs: none
          WebUI/module wrapper: added outside the upstream source tree
          EOF
          rm -f threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip
          (cd threadctl-module && zip -9 -r ../threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip . -x 'BUILD_TRIGGER')
          sha256sum threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip > threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256

      - name: Validate final ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP=threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -E 'module.prop|bin/threadctl|webroot/index.html|webroot/app.js|config/advanced.kdl|LICENSE.threadctl-rs'
          unzip -p "$ZIP" bin/threadctl > /tmp/threadctl
          chmod +x /tmp/threadctl
          file /tmp/threadctl
          readelf -h /tmp/threadctl | grep 'ELF64'
          readelf -h /tmp/threadctl | grep 'AArch64'
          test "$(sha256sum /tmp/threadctl | awk '{print $1}')" = "2ffe4dcf675ce7eeb4797349c6a3a63d3fd21b1b258c7ab68c558ee49dce3a89"

      - name: Publish ZIP to build branch
        shell: bash
        run: |
          set -euxo pipefail
          cp threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip threadctl-build-output/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip
          cp threadctl-release/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256 threadctl-build-output/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threadctl-build-output/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip threadctl-build-output/ThreadCtl-rs-KernelSU-WebUI-v1.0.zip.sha256
          git commit -m "[threadctl-build-output] final original-native KernelSU module"
          git push origin HEAD:build-threadctl-native-20260808

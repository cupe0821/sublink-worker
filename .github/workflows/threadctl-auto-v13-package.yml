name: Package ThreadCtl Auto v1.3

on:
  push:
    branches:
      - build-threadctl-auto-v1.3
    paths-ignore:
      - 'threadctl-release-auto-v1.3/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original native daemon
        run: |
          set -eux
          test -f threadctl-build-output/threadctl
          echo '2ffe4dcf675ce7eeb4797349c6a3a63d3fd21b1b258c7ab68c558ee49dce3a89  threadctl-build-output/threadctl' | sha256sum -c -
          file threadctl-build-output/threadctl | grep -Ei 'ELF 64-bit.*(ARM aarch64|ARM64|aarch64)'

      - name: Validate wrapper and classifier
        run: |
          set -eux
          M=threadctl-module-auto-v1.1
          grep -q '^id=threadctl_rs_webui$' "$M/module.prop"
          grep -q '^version=1.3.0$' "$M/module.prop"
          test "$(cat "$M/scripts/classifier.version")" = '3'
          for f in "$M"/*.sh "$M"/scripts/*.sh; do sh -n "$f"; done
          node --check "$M/webroot/app.js"
          node --check "$M/webroot/kernelsu.js"

          test "$(sh "$M/scripts/classify.sh" com.alibaba.android.rimet)" = 'chat|semantic-chat'
          test "$(sh "$M/scripts/classify.sh" com.spotify.music)" = 'audio|semantic-audio'
          test "$(sh "$M/scripts/classify.sh" com.google.android.youtube)" = 'video|semantic-video'
          test "$(sh "$M/scripts/classify.sh" com.mihoyo.game)" = 'game|semantic-game'
          test "$(sh "$M/scripts/classify.sh" com.example.productivity)" = 'balanced|no-special-signal'

      - name: Assemble module
        run: |
          set -eux
          rm -rf .stage-threadctl threadctl-release-auto-v1.3
          mkdir -p .stage-threadctl threadctl-release-auto-v1.3
          cp -a threadctl-module-auto-v1.1/. .stage-threadctl/
          mkdir -p .stage-threadctl/bin
          cp threadctl-build-output/threadctl .stage-threadctl/bin/threadctl
          chmod 0755 .stage-threadctl/bin/threadctl .stage-threadctl/service.sh .stage-threadctl/action.sh .stage-threadctl/uninstall.sh
          find .stage-threadctl/scripts -type f -name '*.sh' -exec chmod 0755 {} +

      - name: Create and verify ZIP
        run: |
          set -eux
          (cd .stage-threadctl && zip -r -9 ../threadctl-release-auto-v1.3/ThreadCtl-rs-KernelSU-Auto-WebUI-v1.3.zip .)
          unzip -t threadctl-release-auto-v1.3/ThreadCtl-rs-KernelSU-Auto-WebUI-v1.3.zip
          unzip -p threadctl-release-auto-v1.3/ThreadCtl-rs-KernelSU-Auto-WebUI-v1.3.zip bin/threadctl > /tmp/threadctl-from-zip
          echo '2ffe4dcf675ce7eeb4797349c6a3a63d3fd21b1b258c7ab68c558ee49dce3a89  /tmp/threadctl-from-zip' | sha256sum -c -
          sha256sum threadctl-release-auto-v1.3/ThreadCtl-rs-KernelSU-Auto-WebUI-v1.3.zip > threadctl-release-auto-v1.3/ThreadCtl-rs-KernelSU-Auto-WebUI-v1.3.zip.sha256
          sha256sum threadctl-build-output/threadctl > threadctl-release-auto-v1.3/native-threadctl.sha256
          printf '%s\n' \
            'Upstream: https://github.com/StarfallSeas/threadctl-rs' \
            'Upstream commit: 60f223d156d630082a803a165ac9ac898f43f8b9' \
            'Native source modifications: none' \
            'Classifier schema: 3' \
            'v1.3 wrapper: versioned multi-signal classifier, automatic stale-record repair, label cache, transient-failure retry' \
            > threadctl-release-auto-v1.3/PROVENANCE.txt

      - name: Publish package to branch
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threadctl-release-auto-v1.3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: publish ThreadCtl Auto WebUI v1.3 package'
          git push origin HEAD:build-threadctl-auto-v1.3
